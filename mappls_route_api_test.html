<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mappls Route API Test</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;padding:24px;color:#1f2937}
.card{max-width:900px;margin:auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
input,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 16px;border:1px solid #cbd5e1;border-radius:8px}
button{padding:12px 18px;border:0;border-radius:8px;background:#0f766e;color:#fff;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.status{margin-top:18px;padding:14px;border-radius:8px;background:#eef2ff;white-space:pre-wrap}
.ok{background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}
pre{background:#111827;color:#e5e7eb;padding:16px;border-radius:8px;overflow:auto;max-height:420px;font-size:12px}
.warn{background:#fff7ed;color:#9a3412;padding:12px;border-radius:8px;margin-bottom:18px}
</style>
</head>
<body>
<div class="card">
<h2>Mappls Route ADV API Diagnostic</h2>
<p>Test: <b>Jabalpur → Bhopal</b></p>
<div class="warn"><b>Security:</b> Paste your Static Key only into this page. Do not send it in Chat or publish it in a screenshot.</div>

<label>Mappls Static Key</label>
<input id="key" type="password" autocomplete="off" placeholder="Paste your Static Key here">

<label>Profile</label>
<select id="profile">
<option value="driving">Driving — first test</option>
<option value="trucking">Trucking — only if enabled for your application</option>
</select>

<button id="test">Test Mappls Route</button>
<div id="status" class="status">Ready.</div>
<h3>Technical response</h3>
<pre id="out">No request made yet.</pre>
</div>

<script>
const A={lng:79.9864,lat:23.1815}, B={lng:77.4126,lat:23.2599};
const statusEl=document.getElementById('status'), out=document.getElementById('out'), btn=document.getElementById('test');

function status(t,ok){statusEl.textContent=t;statusEl.className='status '+(ok?'ok':'err');}

async function test(){
 const key=document.getElementById('key').value.trim();
 const profile=document.getElementById('profile').value;
 if(!key){status('Please paste your Static Key first.',false);return;}
 btn.disabled=true;
 const coord=`${A.lng},${A.lat};${B.lng},${B.lat}`;
 const urls=[
  `https://route.mappls.com/route/direction/route_adv/${profile}/${coord}?geometries=geojson&overview=full&access_token=${encodeURIComponent(key)}`,
  `https://apis.mappls.com/advancedmaps/v1/${encodeURIComponent(key)}/route_adv/${profile}/${coord}?geometries=geojson&overview=full`
 ];
 let last='';
 for(let i=0;i<urls.length;i++){
  try{
   const r=await fetch(urls[i]);
   const text=await r.text();
   let data; try{data=JSON.parse(text)}catch{data={raw:text}};
   out.textContent=JSON.stringify({endpoint:i===0?'current':'legacy',httpStatus:r.status,ok:r.ok,response:data},null,2);
   if(r.ok){
    let route=data.routes?.[0]||data.route?.[0];
    let msg=`Mappls routing succeeded (HTTP ${r.status}).`;
    if(route){
      const d=route.distance??route.summary?.distance;
      const s=route.duration??route.summary?.duration;
      if(typeof d==='number') msg+=`\nDistance: ${(d/1000).toFixed(2)} km`;
      if(typeof s==='number') msg+=`\nDuration: ${(s/60).toFixed(1)} minutes`;
    }
    status(msg,true); btn.disabled=false; return;
   }
   last=`HTTP ${r.status}`;
  }catch(e){
   last=e.message;
   out.textContent=JSON.stringify({error:e.message,hint:'Failed to fetch usually indicates browser/CORS/domain/security restriction.'},null,2);
  }
 }
 status(`Mappls test failed. Last result: ${last}\nSee Technical response below.`,false);
 btn.disabled=false;
}
btn.onclick=test;
</script>
</body>
</html>
